开发目的: 对离焦微结构眼镜镜片的暗场显微图像自动检测缺陷并客观评定磨损等级，替代人工目视检查。
面向领域/行业: 眼视光与眼镜制造、光学元件质量检测
软件的主要功能: >-
  软件面向离焦微结构镜片暗场显微图像，提供图像导入、缺陷检测、磨损评分、结果展示、批量检测和检测记录管理功能。
  导入整镜图像后，系统将图像切片并调用深度学习检测模型识别划痕、斑点、缺损三类缺陷，跨切片合并重复目标并链接断裂划痕；
  按中心区、微结构区、边缘区加权计算磨损评分（0～100）并给出A/B/C/D等级与文字结论；
  以检测叠加图、缺陷密度地形图、评分因素分解图和评级卡片展示结果；支持多图批量检测并导出CSV汇总表与报告包；
  每次检测自动保存记录，可查询历史并下载检测报告。另提供暗场图像预处理命令行工具和分割模型训练接口。
技术特点标签: 10（人工智能软件）
技术特点: >-
  针对暗场离焦成像，采用整镜切片推理、IOS跨片合并与划痕方向链接算法检测细长缺陷，结合分区加权对数饱和评分模型给出可解释的磨损等级。

